services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escovabits
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      - escovabits_storage:/rails/storage
      - escovabits_db:/rails/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Accept: text/html", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: escovabits-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./selfsigned.crt:/etc/nginx/ssl/selfsigned.crt:ro
      - ./selfsigned.key:/etc/nginx/ssl/selfsigned.key:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  escovabits_storage:
  escovabits_db:
